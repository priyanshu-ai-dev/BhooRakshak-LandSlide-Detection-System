services:
  # ─────────────────────────────────────────────────────────────────
  # PostgreSQL 15 + PostGIS 3.3
  # ─────────────────────────────────────────────────────────────────
  db:
    image: postgis/postgis:15-3.3
    container_name: ner_landslide_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ner_landslide}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ner_landslide}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────────────────────────
  # FastAPI Backend
  # Run manually during development: see README.
  # Uncomment the profile block to exclude from `docker compose up`
  # ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ner_landslide_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-ner_landslide}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - full

  # ─────────────────────────────────────────────────────────────────
  # React / Vite Frontend (dev server)
  # ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ner_landslide_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    profiles:
      - full

volumes:
  postgres_data:
    name: ner_landslide_postgres_data
